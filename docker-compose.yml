services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: stridash
      POSTGRES_PASSWORD: stridash
      POSTGRES_DB: stridash
    ports:
      # 5433 on the host — 5432 commonly conflicts with other local Postgres
      - '5433:5432'
    volumes:
      # PG18 image wants the mount at /var/lib/postgresql (data goes into a
      # subdirectory, enabling in-place pg_upgrade on later major bumps)
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stridash']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata18:
