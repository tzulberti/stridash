# Docker-only development stack. The production stack lives in
# docker-compose.prod.yml and keeps its own project/volumes.
name: stridash-dev

x-dev-app: &dev-app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: stridash-dev:local
  init: true
  working_dir: /app
  restart: unless-stopped
  volumes:
    - .:/app
    # Keep the image-installed dependencies; the bind mount must not hide them.
    - node_modules:/app/node_modules

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: stridash
      POSTGRES_PASSWORD: stridash
      POSTGRES_DB: stridash
    ports:
      - '5433:5432'
    volumes:
      # Keep the same mount shape as docker-compose.yml and the prod stack.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stridash -d stridash']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    <<: *dev-app
    command:
      - sh
      - -c
      - >-
        npm run prisma:generate -w @stridash/server &&
        npm run prisma:migrate:deploy -w @stridash/server &&
        npm run dev -w @stridash/server
    env_file:
      - ./apps/server/.env
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://stridash:stridash@db:5432/stridash?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  web:
    <<: *dev-app
    command: ['npm', 'run', 'dev', '-w', '@stridash/web', '--', '--host', '0.0.0.0']
    environment:
      NODE_ENV: development
      # Vite proxies /api to the server container instead of localhost.
      STRIDASH_API_PROXY: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '5173:5173'

volumes:
  pgdata18:
    name: stridash-dev-pgdata18
  node_modules:
    name: stridash-dev-node_modules
